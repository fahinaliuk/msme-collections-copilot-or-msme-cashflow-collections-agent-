<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MSME Cashflow & Collections Agent</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-3">MSME Cashflow & Collections Agent</h1>
  <p class="text-muted">
    Upload your invoice CSV to see top overdue customers and ready WhatsApp reminders.
  </p>

  <div class="card mb-4">
    <div class="card-body">
      <form id="upload-form">
        <div class="mb-3">
          <label for="file" class="form-label">Invoice CSV</label>
          <input class="form-control" type="file" id="file" name="file" accept=".csv" required />
        </div>
        <button type="submit" class="btn btn-primary">Analyze invoices</button>
        <span id="status" class="ms-3 text-muted"></span>
      </form>
    </div>
  </div>

  <div id="results" class="d-none">
    <h2 class="h5">Results</h2>
    <p>
      Total overdue amount: <strong id="total-overdue-amount"></strong><br />
      Total overdue customers: <strong id="total-overdue-customers"></strong>
    </p>

    <table class="table table-sm table-striped align-middle">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Total overdue</th>
          <th>Max days overdue</th>
          <th>Invoices</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="customers-body"></tbody>
    </table>
  </div>
</div>

<script>
  const form = document.getElementById('upload-form');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const totalOverdueEl = document.getElementById('total-overdue-amount');
  const totalCustomersEl = document.getElementById('total-overdue-customers');
  const customersBody = document.getElementById('customers-body');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = 'Uploading and analyzing...';
    resultsEl.classList.add('d-none');
    customersBody.innerHTML = '';

    const fileInput = document.getElementById('file');
    if (!fileInput.files.length) {
      statusEl.textContent = 'Please select a CSV file.';
      return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
      const response = await fetch('/analyze-invoices', {
        method: 'POST',
        body: formData,
      });
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        statusEl.textContent = err.detail || 'Error analyzing invoices.';
        return;
      }
      const data = await response.json();
      statusEl.textContent = 'Done.';
      renderResults(data);
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Request failed.';
    }
  });

  function renderResults(data) {
    totalOverdueEl.textContent = data.total_overdue_amount.toLocaleString('en-IN', {
      style: 'currency',
      currency: 'INR',
    });
    totalCustomersEl.textContent = data.total_overdue_customers;

    customersBody.innerHTML = '';
    (data.top_customers || []).forEach((cust, index) => {
      const tr = document.createElement('tr');

      const tdName = document.createElement('td');
      tdName.textContent = cust.customer_name;
      tr.appendChild(tdName);

      const tdAmount = document.createElement('td');
      tdAmount.textContent = cust.total_overdue_amount.toLocaleString('en-IN', {
        style: 'currency',
        currency: 'INR',
      });
      tr.appendChild(tdAmount);

      const tdDays = document.createElement('td');
      tdDays.textContent = cust.max_days_overdue;
      tr.appendChild(tdDays);

      const tdCount = document.createElement('td');
      tdCount.textContent = cust.number_of_invoices;
      tr.appendChild(tdCount);

      const tdAction = document.createElement('td');
      const btn = document.createElement('button');
      btn.textContent = 'Show messages';
      btn.className = 'btn btn-sm btn-outline-secondary';
      btn.type = 'button';
      btn.addEventListener('click', () => toggleMessagesRow(index, cust.whatsapp_messages || []));
      tdAction.appendChild(btn);
      tr.appendChild(tdAction);

      customersBody.appendChild(tr);

      // messages row (hidden initially)
      const msgTr = document.createElement('tr');
      msgTr.id = `messages-row-${index}`;
      msgTr.classList.add('d-none');
      const msgTd = document.createElement('td');
      msgTd.colSpan = 5;
      msgTd.innerHTML = (cust.whatsapp_messages || [])
        .map((m, i) => `<p><strong>Message ${i + 1}:</strong> ${m}</p>`)
        .join('');
      msgTr.appendChild(msgTd);
      customersBody.appendChild(msgTr);
    });

    resultsEl.classList.remove('d-none');
  }

  function toggleMessagesRow(index, messages) {
    const row = document.getElementById(`messages-row-${index}`);
    if (!row) return;
    row.classList.toggle('d-none');
  }
</script>
</body>
</html>
