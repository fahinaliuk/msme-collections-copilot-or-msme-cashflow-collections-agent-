services:
  # ================================================================
  # FastAPI Backend — deployed on Render as a Web Service
  # ================================================================
  - type: web
    name: msme-copilot-api
    runtime: python
    region: singapore  # closest to target MSME users
    plan: starter
    healthCheckPath: /api/health

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    envVarGroups:
      - name: msme-copilot

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromGroup: msme-copilot-db
        fromGroupKey: DATABASE_URL_ASYNC
      - key: DATABASE_URL_SYNC
        fromGroup: msme-copilot-db
        fromGroupKey: DATABASE_URL_SYNC
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://msme-copilot.vercel.app
      - key: OPENAI_API_KEY
        sync: false  # set manually in Render dashboard

    # Managed PostgreSQL (Render PostgreSQL)
    disks:
      - name: msme-copilot-db
        mountPath: /data